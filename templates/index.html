<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Faster-Whisper Speech-to-Text</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/style.css">
    <script src="{{ base_path }}/static/js/app.js"></script>
</head>
<body>
    <div id="app">
        
        <div id="optionsPanel">
            <div class="card">
                <h3 id="apiCardTitle">
                    REST API (POST)<br>(Connections: <span title ="" id="connCount">0</span> | Requests: <span id="reqCount">0</span>)
                </h3>
                <div class="option" id="apiOption">
                    <input type="text" id="apiInput" readonly dir="rtl">
                    <button id="copyApiBtn">Copy</button>
                </div>
            </div>
     	    <div class="card">
                <h3 id="wssCardTitle">
                    WebSocket API (WSS) <span id="wssState">⚫</span><br>(Connections: <span title ="" id="wconnCount">0</span> | Requests: <span id="wreqCount">0</span>)
                </h3>
                <div class="option" id="wssOption">
                    <input type="text" id="wssInput" readonly dir="rtl">
                    <button id="copyWssBtn">Copy</button>
                </div>
            </div>
        </div>
        <div id="optionsPanel">
            <div class="card">
                <h3>Microphone</h3>
                <div class="option">
                    <button id="start">Record</button>
                    <button id="stop">Stop</button>
                </div>
            </div>
            <div class="card">
                <h3>Upload File</h3>
                <div class="option">
                    <label for="audioFile" class="custom-file-upload">Browse...</label>
                    <input type="file" id="audioFile" accept="audio/*">
                    <button id="transcribe">Transcribe</button>
                    <span id="fileNameDisplay">No file selected.</span>
               </div>
            </div>
        </div>
        <div id="transcriptionsPanel">
            <h2>Transcriptions</h2>
            <div id="transcriptionsContainer"></div>
        </div>

    
    </div>
</body>
</html>
